    <script>
      (function () {
        try {
          var t = localStorage.getItem("sql2er-theme");
          if (t !== "light" && t !== "dark") {
            t =
              window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          /* localStorage 不可用时按系统偏好走 CSS 兜底 */
        }
      })();
    </script>
