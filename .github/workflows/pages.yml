name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Pages 是单环境，旧的部署作业取消即可，避免乱序覆盖
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build for Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GitHub Pages 项目站点路径 = /<repo>/，否则 dist/ 里 /assets/.. 的绝对路径全部 404。
      # repo 名取自 GITHUB_REPOSITORY (owner/name)，避免硬编码到仓库改名时翻车。
      - name: Resolve base path
        id: base
        run: echo "value=/${GITHUB_REPOSITORY##*/}/" >> "$GITHUB_OUTPUT"

      - name: Build
        run: pnpm build
        env:
          BASE_PATH: ${{ steps.base.outputs.value }}
          VITE_SITE_URL: https://${{ github.repository_owner }}.github.io

      # 隐藏式 sourcemap 只用于本地对照调试，不发布到 Pages
      - name: Strip sourcemaps from Pages artifact
        run: find dist -name "*.map" -type f -delete

      # 仓库未开 Pages 时 configure-pages 会 404；先探测，未开通则跳过上传，避免整次 push 红叉。
      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

    outputs:
      ready: ${{ steps.pages.outcome == 'success' }}

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
        with:
          timeout: 900000
